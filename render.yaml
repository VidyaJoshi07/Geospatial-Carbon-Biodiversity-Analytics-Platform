services:
  # Backend FastAPI Service on Render
  - type: web
    name: darukaa-earth-api
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: darukaa-earth-postgis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: CORS_ORIGINS
        value: '["https://darukaa-earth.vercel.app","http://localhost:5173"]'

databases:
  # Render PostgreSQL Database with PostGIS enabled
  - name: darukaa-earth-postgis
    plan: starter
    region: oregon
    postgresMajorVersion: 16
    ipAllowList: []
